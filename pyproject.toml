[project]
name = "adhikar"
version = "0.1.0"
description = "Verifiable legal-document analysis: every claim anchored to a span, every span checked."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Akshay Kaushik" }]
keywords = ["legal-tech", "rag", "provenance", "prompt-injection", "accessibility"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "pyyaml>=6.0.2",
    "python-dateutil>=2.9",
    "structlog>=24.4",
    "pdfminer.six>=20240706",
    "python-docx>=1.1.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # starlette.testclient requires httpx2 (not httpx). Declared explicitly:
    # it otherwise arrives only transitively via the anthropic extra, so
    # `pip install -e ".[dev]"` alone would leave the suite uncollectable.
    "httpx2>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit[toml]>=1.8",
    "pip-audit>=2.7",
    "types-python-dateutil",
    "types-pyyaml",
]

[project.scripts]
adhikar = "adhikar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adhikar"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # no print
    "PT",        # pytest style
    "RET",       # returns
    "SIM",       # simplify
    "PTH",       # pathlib
    "ERA",       # commented-out code
    "PL",        # pylint
    "TRY",       # tryceratops
    "RUF",
    "S",         # bandit-equivalent rules
    "ASYNC",
]
ignore = [
    "PLR0913",  # argument count - analysis pipelines legitimately take many inputs
    "TRY003",   # long messages in raised exceptions are good errors
    # This codebase uses typographic punctuation in prose and user-facing strings
    # (en dashes, ellipses, curly quotes). The "ambiguous character" rules exist
    # to catch homoglyph smuggling in source, which is a real concern here --
    # but it is handled where it matters, by PLE2502/PLE2515 remaining enabled
    # everywhere except the two modules whose job is to carry those characters.
    "RUF001", "RUF002", "RUF003",
    # Lazy imports are deliberate throughout: they break circular dependencies
    # between the pipeline and its stages, and keep optional dependencies
    # optional (the anthropic SDK, python-docx). Each is commented at its site.
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
# Asserts and dummy secrets are the point of a test suite.
"tests/**" = ["S101", "PLR2004", "S105", "S106", "PLR0917"]
# A command-line tool and a demonstration script write to stdout by design.
"scripts/**" = ["T20"]
"src/adhikar/cli.py" = ["T201"]
# These two modules deliberately contain zero-width and bidirectional control
# characters, and Latin-lookalike codepoints from other scripts: detecting them
# is what they are for. The rules stay enabled everywhere else.
"src/adhikar/security/injection.py" = ["PLE2502", "PLE2515"]
"tests/security/test_injection.py" = ["PLE2502", "PLE2515"]
# Numeric literals in these modules are the specification rather than magic:
# an Aadhaar number is twelve digits, a week is seven days, a PDF page has four
# bbox coordinates. Each is used once, in context, next to its explanation.
"src/adhikar/security/checksums.py" = ["PLR2004"]
"src/adhikar/analysis/deadlines.py" = ["PLR2004"]
"src/adhikar/ingest/extract.py" = ["PLR2004"]
# FastAPI route signatures are wide by construction: each dependency is an
# explicit parameter, which is the framework's design rather than a smell.
"src/adhikar/web/routes.py" = ["PLR0917"]
"src/adhikar/api/routes.py" = ["PLR0917"]

[tool.ruff.lint.isort]
known-first-party = ["adhikar"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []
mypy_path = "src"
packages = ["adhikar"]

[[tool.mypy.overrides]]
module = ["pdfminer.*", "docx.*", "anthropic.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "live: tests that require a real ANTHROPIC_API_KEY (deselected by default)",
]
filterwarnings = [
    # Warnings in our own code are failures: a DeprecationWarning we ignore today
    # is a breakage on the next dependency bump.
    "error",
    # Starlette's TestClient reaches for a deprecated anyio alias. Ignored
    # narrowly, by message, so the strict default still applies everywhere else.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/adhikar"]
branch = true
omit = ["src/adhikar/web/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "@overload",
]
fail_under = 85
show_missing = true

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
