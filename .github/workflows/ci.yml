name: CI

# Runs with no API keys. The scenario answers and the citation verifier are real
# implementations, not stubs, so a fork with no secrets gets identical results.
on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci

      - name: Dependency audit
        # The Vercel AI SDK was removed to reach zero; this keeps it there.
        run: npm audit --audit-level=moderate

      - name: Assert no secrets are committed
        run: |
          if git grep -nIE '(sk-ant-[A-Za-z0-9]{20,}|sk-proj-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})' \
               -- ':!*.md' ':!.env.example'; then
            echo "::error::A credential-shaped string is present in the tree"
            exit 1
          fi
          echo "No credential-shaped strings found."

      - name: Assert API keys never reach the client bundle
        # A key read in a client component would be inlined into JavaScript served
        # to every visitor. This is the check that would catch it.
        run: |
          npm run build
          if grep -rlE 'GOOGLE_GENERATIVE_AI_API_KEY|OPENAI_API_KEY|ANTHROPIC_API_KEY' .next/static 2>/dev/null; then
            echo "::error::An API key name appears in the client bundle"
            exit 1
          fi
          echo "No provider key names in the client bundle."

      - name: Assert dangerouslySetInnerHTML is absent
        run: |
          if git grep -n 'dangerouslySetInnerHTML' -- 'app' 'components' 'lib'; then
            echo "::error::dangerouslySetInnerHTML found; this app renders untrusted text"
            exit 1
          fi
          echo "No raw HTML injection points."
