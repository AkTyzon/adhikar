# Clause taxonomy, risk detectors and fair-terms baselines.
#
# This file is the product's domain knowledge. No clause name, keyword, risk
# threshold or baseline position appears in Python: adding a jurisdiction or a
# contract family is a data change that a lawyer can review without reading code,
# and the analysis engine cannot drift from what this file says because it has no
# independent copy of it.
#
# Condition language (evaluated by adhikar.analysis.rules):
#   any:  [regex, ...]   at least one must match
#   all:  [regex, ...]   every one must match
#   none: [regex, ...]   none may match
#   near: {left: regex, right: regex, window: int}
#                        both match within `window` characters of each other
#
# Severities: info | low | medium | high | critical

version: 1

clause_types:

  # ------------------------------------------------------------------ liability
  - id: limitation_of_liability
    title: Limitation of Liability
    plain_language: >-
      Sets the maximum amount one side can be made to pay if something goes
      wrong. This is usually the single most important number in a contract.
    detectors:
      any:
        - '\blimitation of liability\b'
        - '\b(?:aggregate|total|maximum|cumulative)\s+liability\b'
        - '\bshall not (?:be liable|exceed)\b'
        - '\bin no event shall\b.{0,60}\bliable\b'
    baseline:
      expected: >-
        Liability capped at the fees paid in the twelve months before the claim,
        with the cap applying to both parties equally.
      favourable_markers:
        - '\b(?:twelve|12)\s*(?:\(12\)\s*)?months?\b'
        - '\beach party\b|\bboth parties\b|\bmutual\b'
    risks:
      - id: unlimited_liability
        severity: critical
        title: Your liability is not capped
        when:
          any:
            - '\bunlimited liability\b'
            - '\bwithout (?:any )?limit(?:ation)?\b'
            - '\bno (?:cap|limit) (?:on|to)\b.{0,40}\bliability\b'
            - '\bliability shall not be limited\b'
        why_it_matters: >-
          Without a cap, a single claim can exceed everything you earn from this
          contract. Uncapped exposure is the most common reason a deal that looks
          profitable turns into a loss.
        questions_for_lawyer:
          - Can the liability cap be made mutual and limited to fees paid?
          - Which categories are carved out of the cap, and why those?
      - id: one_sided_cap
        severity: high
        title: The liability cap protects only the other side
        when:
          all:
            - '\b(?:aggregate|total|maximum)\s+liability\b'
          none:
            - '\beach party\b|\bboth parties\b|\bmutual(?:ly)?\b|\brespective\b'
        why_it_matters: >-
          A cap that names only one party leaves the other exposed in full. Caps
          are normally reciprocal.
        questions_for_lawyer:
          - Should this cap apply to both parties rather than one?
      - id: excludes_consequential
        severity: info
        title: Indirect losses are excluded
        when:
          any:
            - '\b(?:consequential|indirect|incidental|special|punitive)\s+(?:loss|damage)'
        why_it_matters: >-
          Standard and usually reasonable: it excludes knock-on losses such as
          lost profits. Worth knowing it is there.

  # ------------------------------------------------------------------ indemnity
  - id: indemnity
    title: Indemnity
    plain_language: >-
      A promise to cover someone else's losses, including their legal costs, if a
      particular kind of problem arises.
    detectors:
      any:
        - '\bindemnif(?:y|ies|ication|ied)\b'
        - '\bhold harmless\b'
        - '\bdefend(?:,| and) indemnify\b'
    baseline:
      expected: >-
        A mutual indemnity limited to third-party claims caused by the
        indemnifying party's own breach or negligence, subject to the liability cap.
      favourable_markers:
        - '\bthird[- ]party claims?\b'
        - '\bmutual(?:ly)?\b|\beach party\b'
        - '\bto the extent (?:caused|arising) (?:by|from)\b'
    risks:
      - id: uncapped_indemnity
        severity: critical
        title: The indemnity sits outside the liability cap
        when:
          near:
            left: '\bindemnif'
            right: '\b(?:notwithstanding|regardless of|without regard to)\b.{0,60}\b(?:limitation|cap)\b'
            window: 400
        why_it_matters: >-
          An indemnity carved out of the liability cap makes the cap decorative.
          This is where unlimited exposure usually hides in an otherwise
          reasonable contract.
        questions_for_lawyer:
          - Should the indemnity be brought inside the liability cap?
      - id: indemnity_without_limit
        severity: critical
        title: The indemnity is expressly unlimited
        when:
          near:
            left: '\bindemnif'
            right: '\b(?:without limit(?:ation)?|unlimited|no (?:cap|limit)|not (?:be )?limited)\b'
            window: 300
        why_it_matters: >-
          An indemnity that says outright it is not limited exposes you to the
          full value of any claim it covers, however large, regardless of what
          the contract's liability cap says elsewhere.
        questions_for_lawyer:
          - Can this indemnity be brought within the overall liability cap?
          - What is the realistic worst-case value of a claim under this clause?
      - id: one_sided_indemnity
        severity: high
        title: You indemnify them, but they do not indemnify you
        when:
          all:
            - '\bindemnif'
          none:
            - '\bmutual(?:ly)?\b|\beach party\b|\brespectively\b|\bboth parties\b'
        why_it_matters: >-
          A one-way indemnity means you carry the cost of disputes even when the
          other side caused them.
        questions_for_lawyer:
          - Can this indemnity be made mutual?
      - id: broad_indemnity_trigger
        severity: high
        title: The indemnity is triggered by any claim, not just your fault
        when:
          any:
            - '\bany and all claims\b'
            - '\bindemnif\w+[^.]{0,80}\barising (?:out of|from)\b[^.]{0,60}\bthis agreement\b'
          none:
            - '\bto the extent (?:caused|arising|attributable)\b'
            - '\bnegligence or wilful misconduct\b|\bnegligence or willful misconduct\b'
        why_it_matters: >-
          Indemnities normally bite only where the indemnifying party was at
          fault. A trigger of "any claim arising from this agreement" can capture
          claims you had nothing to do with.
        questions_for_lawyer:
          - Can the trigger be narrowed to claims caused by our breach or negligence?

  # ------------------------------------------------------------------ renewal
  - id: auto_renewal
    title: Automatic Renewal
    plain_language: >-
      The contract renews itself unless you actively cancel in time.
    detectors:
      any:
        - '\b(?:automatically|auto)[- ]?renew'
        - '\brenew(?:s|ed|al)? (?:automatically|for (?:successive|additional))\b'
        - '\bevergreen\b'
    baseline:
      expected: >-
        Renewal with at least thirty days notice, cancellable by either party.
      favourable_markers:
        - '\b(?:thirty|30)\s*(?:\(30\)\s*)?days?\b'
        - '\beither party\b'
    risks:
      - id: long_notice_window
        severity: high
        title: The cancellation window is long or awkward
        when:
          any:
            - '\b(?:sixty|60|ninety|90|one hundred (?:and )?eighty|180)\s*(?:\(\d+\)\s*)?days?\b.{0,80}\b(?:notice|prior to|before)\b'
            - '\b(?:notice|prior to|before)\b.{0,60}\b(?:sixty|60|ninety|90|180)\s*(?:\(\d+\)\s*)?days?\b'
        why_it_matters: >-
          A long notice window means the decision to renew is effectively made
          months before renewal. Miss it and you are committed to another full term.
        questions_for_lawyer:
          - Can the notice period be shortened, or a reminder obligation added?
      - id: renewal_price_uncontrolled
        severity: medium
        title: The renewal price is not fixed
        when:
          all:
            - '\brenew'
          none:
            - '\b(?:same|then[- ]current|unchanged|fixed) (?:fees?|rates?|price)\b'
            - '\bfees? shall not increase\b'
        why_it_matters: >-
          If renewal pricing is not constrained, the renewal term can cost
          materially more than the first.
        questions_for_lawyer:
          - Can renewal pricing be capped, for example to inflation?

  # ------------------------------------------------------------------ termination
  - id: termination
    title: Termination
    plain_language: >-
      How and when each side can end the contract.
    detectors:
      any:
        - '\bterminat(?:e|ion|ing)\b'
        - '\bright to (?:cancel|end) this agreement\b'
    baseline:
      expected: >-
        Either party may terminate for convenience on reasonable notice, and for
        material breach after a cure period.
      favourable_markers:
        - '\beither party\b'
        - '\bcure period\b|\bremedy (?:the|such) breach\b|\bfails? to cure\b'
    risks:
      - id: asymmetric_termination
        severity: high
        title: Only one side can walk away freely
        when:
          near:
            left: '\bterminate\b.{0,80}\bfor convenience\b|\bfor convenience\b.{0,40}\bterminate'
            right: '\b(?:client|customer|company|provider|supplier|vendor)\b'
            window: 250
          none:
            - '\beither party may terminate (?:this agreement )?for convenience\b'
        why_it_matters: >-
          If the other side can exit at will and you cannot, your planning
          horizon is only as long as their notice period.
        questions_for_lawyer:
          - Can termination for convenience be made mutual?
      - id: no_cure_period
        severity: medium
        title: Breach allows immediate termination with no chance to fix it
        when:
          all:
            - '\bterminat\w+ (?:immediately|forthwith|without notice)\b'
          none:
            - '\bcure\b|\bremedy\b|\bthirty \(30\) days\b'
        why_it_matters: >-
          Without a cure period, a minor or inadvertent breach can end the
          contract before you have a chance to put it right.
        questions_for_lawyer:
          - Can a cure period of 30 days be added for remediable breaches?

  # ------------------------------------------------------------------ payment
  - id: payment_terms
    title: Payment Terms
    plain_language: >-
      When money is due, and what happens if it is late.
    detectors:
      any:
        - '\b(?:payment|invoice|fees?|remuneration)\b.{0,60}\b(?:due|payable|within)\b'
        - '\bnet\s*(?:15|30|45|60|90)\b'
        - '\blate payment\b|\binterest (?:on|shall accrue)\b'
    baseline:
      expected: >-
        Payment within 30 days of a valid invoice, with interest on late payment
        at a defined, reasonable rate.
      favourable_markers:
        - '\b(?:thirty|30)\s*(?:\(30\)\s*)?days?\b'
    risks:
      - id: long_payment_terms
        severity: medium
        title: You wait a long time to be paid
        when:
          any:
            - '\bnet\s*(?:60|90|120)\b'
            - '\bwithin\s+(?:sixty|60|ninety|90|one hundred (?:and )?twenty|120)\s*(?:\(\d+\)\s*)?days?\b.{0,40}\b(?:payment|invoice|paid)\b'
        why_it_matters: >-
          Payment terms beyond 30 days shift working-capital cost onto you.
        questions_for_lawyer:
          - Can payment terms be shortened to 30 days?
      - id: punitive_late_interest
        severity: medium
        title: Late-payment interest is unusually high
        when:
          any:
            - '\b(?:[3-9]|[1-9]\d)(?:\.\d+)?\s*%\s*per\s*month\b'
            - '\b(?:2[5-9]|[3-9]\d|\d{3,})(?:\.\d+)?\s*%\s*per\s*(?:annum|year)\b'
        why_it_matters: >-
          Interest rates well above commercial norms can compound quickly and may
          be challengeable, but only after a dispute you would rather avoid.
        questions_for_lawyer:
          - Is this interest rate enforceable in the governing jurisdiction?

  # ------------------------------------------------------------------ IP
  - id: ip_assignment
    title: Intellectual Property
    plain_language: >-
      Who owns what is created, and what each side may do with the other's
      existing material.
    detectors:
      any:
        - '\bintellectual property\b'
        - '\b(?:assigns?|assignment of|vest(?:s|ed)? in)\b.{0,60}\b(?:copyright|patent|IP|invention)'
        - '\bwork(?:s)? made for hire\b'
        - '\bmoral rights\b'
    baseline:
      expected: >-
        Each party keeps its pre-existing IP; newly created deliverables transfer
        on payment, with a licence back for the creator's general know-how.
      favourable_markers:
        - '\bpre[- ]?existing\b|\bbackground (?:IP|intellectual property)\b'
        - '\bupon (?:full )?payment\b'
    risks:
      - id: assigns_background_ip
        severity: critical
        title: You may be assigning IP you already owned
        when:
          all:
            - '\b(?:all|any)\b.{0,40}\bintellectual property\b'
          none:
            - '\bpre[- ]?existing\b|\bbackground (?:IP|intellectual property)\b|\bexcluding\b'
        why_it_matters: >-
          A sweeping assignment with no carve-out for what you already owned can
          transfer tools, libraries and methods you rely on for other work.
        questions_for_lawyer:
          - Can we carve out pre-existing and background IP from this assignment?
      - id: no_licence_back
        severity: medium
        title: No licence back to use your own methods
        when:
          all:
            - '\bassign'
            - '\bintellectual property\b'
          none:
            - '\blicen[sc]e back\b|\bretains? (?:a|the) (?:non[- ]exclusive )?licen[sc]e\b'
        why_it_matters: >-
          Without a licence back, generic techniques developed during the work may
          no longer be yours to reuse.
        questions_for_lawyer:
          - Can we retain a licence to reuse general know-how and tooling?

  # ------------------------------------------------------------------ restraint
  - id: non_compete
    title: Non-Compete and Non-Solicit
    plain_language: >-
      Limits on who you may work with or hire after this contract.
    detectors:
      any:
        - '\bnon[- ]?compet'
        - '\bshall not.{0,60}\bcompet'
        - '\bnon[- ]?solicit'
        - '\brestraint of trade\b'
    baseline:
      expected: >-
        Narrow, time-limited and tied to a defined market; non-solicitation of
        named staff rather than a general hiring ban.
      favourable_markers:
        - '\b(?:six|6|twelve|12)\s*(?:\(\d+\)\s*)?months?\b'
    risks:
      - id: broad_non_compete
        severity: high
        title: The restriction is wide or long
        when:
          any:
            - '\b(?:worldwide|any (?:jurisdiction|territory|country)|globally)\b'
            - '\b(?:two|2|three|3|five|5)\s*(?:\(\d+\)\s*)?years?\b'
            - '\bin perpetuity\b|\bindefinitely\b'
        why_it_matters: >-
          Restrictions wider than necessary to protect a legitimate interest may
          be unenforceable in some jurisdictions, but you would have to litigate
          to find out. In India, restraints operating after a contract ends are
          generally void under section 27 of the Indian Contract Act.
        questions_for_lawyer:
          - Is this restraint enforceable in our governing jurisdiction?
          - Can the scope be narrowed to a defined market and period?

  # ------------------------------------------------------------------ disputes
  - id: dispute_resolution
    title: Dispute Resolution
    plain_language: >-
      Where and how arguments get settled, and who pays for it.
    detectors:
      any:
        - '\barbitrat'
        - '\bdispute resolution\b'
        - '\b(?:exclusive )?jurisdiction\b'
        - '\bgoverning law\b'
    baseline:
      expected: >-
        A named, convenient forum with shared costs and no waiver of the right to
        bring a claim.
      favourable_markers:
        - '\beach party (?:shall )?bears? its own costs\b'
    risks:
      - id: distant_forum
        severity: medium
        title: Disputes must be raised in a distant forum
        when:
          near:
            left: '\b(?:exclusive )?jurisdiction\b|\bvenue\b|\bseat of arbitration\b'
            right: '\b(?:New York|London|Singapore|Delaware|California|Dubai|Hong Kong)\b'
            window: 200
        why_it_matters: >-
          The cost of bringing or defending a claim in a distant forum can exceed
          the value of the claim, which in practice removes the remedy.
        questions_for_lawyer:
          - Can the forum be moved, or a neutral venue agreed?
      - id: class_action_waiver
        severity: medium
        title: Group claims are waived
        when:
          any:
            - '\bclass action waiver\b'
            - '\bwaives? (?:any|all) right.{0,60}\bclass\b'
            - '\bindividual basis\b.{0,60}\bnot.{0,20}\bclass\b'
        why_it_matters: >-
          Where the individual amount at stake is small, a group claim may be the
          only economic route to a remedy.
        questions_for_lawyer:
          - What practical remedies remain if this waiver applies?

  # ------------------------------------------------------------------ amendment
  - id: unilateral_amendment
    title: Changes to the Agreement
    plain_language: >-
      Whether the other side can change the deal without asking you.
    detectors:
      any:
        - '\b(?:amend|modif|vary|change|update)\w*\b.{0,60}\b(?:this agreement|these terms)\b'
        - '\bat (?:its|our|their) (?:sole )?discretion\b.{0,60}\b(?:amend|modif|change)'
    baseline:
      expected: >-
        Changes require written agreement from both parties.
      favourable_markers:
        - '\bwritten (?:agreement|consent) of both parties\b'
        - '\bsigned by (?:both|each) part(?:y|ies)\b'
    risks:
      - id: unilateral_change_right
        severity: high
        title: The other side can change the terms on their own
        when:
          any:
            - '\bmay (?:amend|modify|change|update|revise)\b.{0,80}\b(?:at any time|without notice|in its sole discretion)\b'
            - '\breserves? the right to (?:amend|modify|change|update)\b'
        why_it_matters: >-
          A unilateral amendment right means the terms you agreed are not the
          terms you are bound by tomorrow. Continued use is often deemed acceptance.
        questions_for_lawyer:
          - Can changes require notice and a right to terminate without penalty?

  # ------------------------------------------------------------------ data
  - id: data_protection
    title: Data Protection and Privacy
    plain_language: >-
      What happens to personal data the other side handles for you.
    detectors:
      any:
        - '\bpersonal data\b|\bpersonal information\b'
        - '\bdata protection\b|\bGDPR\b|\bDPDP\b|\bprivacy policy\b'
        - '\bdata (?:processor|controller|fiduciary)\b'
    baseline:
      expected: >-
        Processing limited to documented instructions, with breach notification,
        deletion on termination, and controls on sub-processors and transfers.
      favourable_markers:
        - '\bnotif\w+\b.{0,40}\b(?:breach|incident)\b'
        - '\bdelete\b.{0,40}\b(?:termination|expiry)\b'
    risks:
      - id: broad_data_rights
        severity: high
        title: Your data may be used for their own purposes
        when:
          any:
            - '\b(?:use|process)\b.{0,60}\bfor (?:its|their) own (?:business |commercial )?purposes\b'
            - '\bimprov\w+\b.{0,40}\b(?:its|our|their) (?:products?|services?|models?)\b'
            - '\btrain\w*\b.{0,40}\b(?:models?|algorithms?|AI)\b'
        why_it_matters: >-
          Data supplied for one purpose being reused for another may breach your
          own commitments to customers or staff, regardless of what this contract says.
        questions_for_lawyer:
          - Can secondary use of our data be removed or made opt-in?
      - id: no_breach_notification
        severity: medium
        title: No commitment to tell you about a breach
        when:
          all:
            - '\bpersonal data\b|\bpersonal information\b'
          none:
            - '\bnotif\w+\b.{0,60}\b(?:breach|incident|unauthorised|unauthorized)\b'
        why_it_matters: >-
          If you are not told promptly about a breach, you cannot meet your own
          notification deadlines to regulators or affected people.
        questions_for_lawyer:
          - Can a defined breach-notification window be added?

  # ------------------------------------------------------------------ confidentiality
  - id: confidentiality
    title: Confidentiality
    plain_language: >-
      What each side must keep secret, and for how long.
    detectors:
      any:
        - '\bconfidential(?:ity)?\b'
        - '\bnon[- ]?disclosure\b'
        - '\btrade secrets?\b'
    baseline:
      expected: >-
        Mutual obligations with standard carve-outs, lasting three to five years
        after the contract ends.
      favourable_markers:
        - '\bmutual\b|\beach party\b'
        - '\bpublicly available\b|\bindependently developed\b'
    risks:
      - id: perpetual_confidentiality
        severity: medium
        title: The confidentiality obligation never ends
        when:
          any:
            - '\bin perpetuity\b'
            - '\bsurvive\w*\b.{0,60}\bindefinitely\b'
            - '\bperpetual\w*\b.{0,40}\bconfidential'
        why_it_matters: >-
          An obligation with no end date is impossible to ever formally discharge,
          and can outlive the records needed to prove compliance.
        questions_for_lawyer:
          - Can a definite term, such as five years, be agreed instead?
      - id: one_sided_confidentiality
        severity: medium
        title: Only you are bound to keep secrets
        when:
          all:
            - '\bconfidential'
          none:
            - '\bmutual\b|\beach party\b|\bboth parties\b|\breceiving party\b'
        why_it_matters: >-
          A one-way obligation means your information is protected only by their
          goodwill.
        questions_for_lawyer:
          - Can the confidentiality obligation be made mutual?
